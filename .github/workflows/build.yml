name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'plan/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The IntelliJ Platform build needs tens of GB (IDE distributions, extracted
      # transforms, verifier IDEs); the stock runner image runs out of disk while
      # saving the Gradle cache. Drop preinstalled toolchains this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Extracted IDE distributions live under transforms and are re-derivable
          # from the cached downloads; archiving them is what exhausts the disk.
          gradle-home-cache-excludes: |
            caches/**/transforms

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Plugin Verifier
        run: ./gradlew :plugin:verifyPlugin --no-daemon

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: plugin/build/distributions/*.zip
          if-no-files-found: error

      # The Actions log API is not always reachable, so a failing run must leave
      # behind enough evidence to identify the failing test without it.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: plugin/build/reports/pluginVerifier/**
          if-no-files-found: ignore
