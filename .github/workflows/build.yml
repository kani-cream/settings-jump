name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'plan/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  INTEGRATION_TEST_REPORT: plugin/build/test-results/test/TEST-com.github.kanicream.settingsjump.index.IndexAndNavigationIntegrationTest.xml

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The IntelliJ Platform build needs tens of GB (IDE distributions, extracted
      # transforms, verifier IDEs); the stock runner image runs out of disk while
      # saving the Gradle cache. Drop preinstalled toolchains this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Extracted IDE distributions live under transforms and are re-derivable
          # from the cached downloads; archiving them is what exhausts the disk.
          gradle-home-cache-excludes: |
            caches/**/transforms

      - name: Build and test
        run: ./gradlew build :plugin:buildPlugin --no-daemon

      # Gradle reports success when it silently drops a test class it cannot load,
      # which is what happens to BasePlatformTestCase without the test framework.
      - name: Check integration tests ran
        run: test -f "$INTEGRATION_TEST_REPORT"

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: plugin/build/distributions/*.zip
          if-no-files-found: error

      # The Actions log API is not always reachable, so a failing run must leave
      # behind enough evidence to identify the failing test without it.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  # Each shard resolves only its own IDEs, which shortens the run and limits how much
  # disk a single runner needs. plugin/build.gradle.kts defines the split.
  verify:
    name: Verify ${{ matrix.verifier-shard }} IDEs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        verifier-shard: [ older, unified ]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/**/transforms

      - name: Plugin Verifier
        run: ./gradlew :plugin:verifyPlugin -PverifierShard=${{ matrix.verifier-shard }} --no-daemon

      - name: Report disk usage
        if: always()
        run: df -h /

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports-${{ matrix.verifier-shard }}
          path: plugin/build/reports/pluginVerifier/**
          if-no-files-found: ignore

  # Plugin Verifier only checks binary compatibility, so also run the tests on the
  # newer IDEs listed under ideTarget in gradle.properties.
  test-newer-ides:
    name: Test on ${{ matrix.ide-target }} IDE
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ide-target: [ stable, next ]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/**/transforms

      - name: Test
        run: ./gradlew :plugin:test -PideTarget=${{ matrix.ide-target }} --no-daemon

      - name: Check integration tests ran
        run: test -f "$INTEGRATION_TEST_REPORT"

      - name: Report disk usage
        if: always()
        run: df -h /

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.ide-target }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
