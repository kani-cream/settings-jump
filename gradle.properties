org.gradle.jvmargs=-Xmx2048m
org.gradle.caching=true

# The IntelliJ Platform bundles the Kotlin stdlib; no explicit stdlib dependency needed.
kotlin.stdlib.default.dependency=false

# Newer IDEs the test suite also runs on, selected with -PideTarget=<name>. The
# distribution is always built from the baseline in plugin/build.gradle.kts.
ideTarget.stable.version=2026.2.4
ideTarget.stable.sinceBuild=262
ideTarget.next.version=263.7307.112
ideTarget.next.sinceBuild=263

# Ultimate's obfuscated startup activities cannot be instantiated on the test classpath of
# the unified IDE distribution (2025.3+), which fails every BasePlatformTestCase. Setting
# this replaces the plugin defaults, so the entries before the last one restate them.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=com.intellij.openRewrite,com.intellij.ja,com.intellij.ko,com.intellij.zh,com.intellij.modules.ultimate
